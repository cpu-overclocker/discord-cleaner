name: Syntax Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JS syntax
        run: |
          set -e
          for f in friends-cleaner/*.js groups-cleaner/*.js dm-cleaner/*.js; do
            echo "Checking $f"
            node --check "$f"
          done